spring.application.name=mail-ocr-api
server.port=${SERVER_PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/mail_ocr}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

mail-ocr.project-root=${MAIL_OCR_PROJECT_ROOT:..}
mail-ocr.python-executable=${MAIL_OCR_PYTHON:.venv312/Scripts/python.exe}
mail-ocr.model-path=${MAIL_OCR_MODEL:models/yolo_regions/mail_3field/weights/best.pt}
mail-ocr.output-dir=${MAIL_OCR_OUTPUT_DIR:debug_3field}
mail-ocr.upload-dir=${MAIL_OCR_UPLOAD_DIR:uploads}
mail-ocr.default-ocr-backend=${MAIL_OCR_BACKEND:vietocr}
mail-ocr.allowed-origin=${MAIL_OCR_ALLOWED_ORIGIN:http://localhost:5173}
